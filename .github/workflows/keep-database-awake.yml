# Free Supabase projects are paused after about a week without any activity.
# This sends one tiny request twice a week so the shared database stays awake
# through quiet stretches (summer, winter break).
#
# It only does something when the shared database is switched on (the two
# repository variables are set). Note: GitHub itself stops scheduled jobs in a
# repository that has had no changes for 60 days — it emails you first, and one
# click on "Enable workflow" in the Actions tab keeps this going.

name: Keep database awake

on:
  schedule:
    - cron: '17 9 * * 1,4' # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a small request to the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "The shared database is not switched on; nothing to do."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/app_needs_setup" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Database answered with status $status"
          if [ "$status" != "200" ]; then
            echo "::warning::The database did not answer normally. If the project is paused, restore it from the Supabase dashboard."
          fi
